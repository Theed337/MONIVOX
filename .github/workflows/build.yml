name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Jeder Build bekommt eine fortlaufende Version; Releases entstehen nur auf main.
  MONIVOX_VERSION: 0.3.${{ github.run_number }}
  # Mitgelieferter, offiziell signierter Virtual Display Driver (MIT) – Version und Prüfsumme festgenagelt
  VDD_URL: https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip
  VDD_SHA256: e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a

jobs:
  core-tests:
    name: Kernlogik-Tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Monivox.Core.Tests -c Release --logger "console;verbosity=normal"

  windows:
    name: App, Compositor, CLI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Native Komponenten (CMake/MSVC)
        shell: pwsh
        run: |
          cmake -S native -B build\native -A x64
          cmake --build build\native --config Release -- /nologo /v:minimal | Tee-Object -FilePath cmake.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path cmake.log -Pattern ": (fatal )?error |error MSB|error [A-Z]+\d+" | Select-Object -First 8 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit 1
          }
      - name: App + CLI veröffentlichen
        shell: pwsh
        run: |
          foreach ($proj in "src\Monivox.App", "src\Monivox.Cli") {
            dotnet publish $proj -c Release -r win-x64 --self-contained false -o dist\Monivox -p:Version=$env:MONIVOX_VERSION -nologo -clp:NoSummary | Tee-Object -FilePath publish.log
            if ($LASTEXITCODE -ne 0) {
              Select-String -Path publish.log -Pattern "error [A-Z]+\d+" | Select-Object -First 8 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
              exit 1
            }
          }
      - name: Anzeigetreiber einbinden (geprüfte Prüfsumme)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:VDD_URL -OutFile vdd.zip
          $hash = (Get-FileHash vdd.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:VDD_SHA256) { Write-Output "::error::Prüfsumme des Treiberpakets stimmt nicht ($hash)"; exit 1 }
          Expand-Archive vdd.zip -DestinationPath vdd-x
          New-Item -ItemType Directory -Force dist\Monivox\vdd | Out-Null
          Copy-Item vdd-x\VirtualDisplayDriver\* dist\Monivox\vdd\
          $sig = Get-AuthenticodeSignature dist\Monivox\vdd\mttvdd.cat
          Write-Output "Treibersignatur: $($sig.Status) – $($sig.SignerCertificate.Subject)"
      - name: Zusammenstellen
        shell: pwsh
        run: |
          Copy-Item build\native\Release\MonivoxCompositor.exe dist\Monivox\
          Copy-Item build\native\Release\MonivoxDevice.exe dist\Monivox\
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md dist\Monivox\
          Get-ChildItem dist\Monivox | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/Monivox

  package:
    name: Gesamtpaket + Release
    needs: [core-tests, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: Monivox
      - name: ZIP + Prüfsumme
        run: |
          cd Monivox && zip -qr ../Monivox-win-x64.zip . && cd ..
          sha256sum Monivox-win-x64.zip | cut -d' ' -f1 > Monivox-win-x64.zip.sha256
          cat Monivox-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Monivox-win-x64
          path: Monivox
      - name: Release veröffentlichen (Auto-Update-Quelle)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${MONIVOX_VERSION}" Monivox-win-x64.zip Monivox-win-x64.zip.sha256 \
            --repo "${{ github.repository }}" \
            --title "MONIVOX ${MONIVOX_VERSION}" \
            --notes "Automatisch erstellt aus ${GITHUB_SHA::7}. MONIVOX lädt dieses Update selbstständig." \
            --target "${GITHUB_SHA}"
